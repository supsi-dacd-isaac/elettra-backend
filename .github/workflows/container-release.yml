name: Test and release backend container

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: ghcr.io/supsi-dacd-isaac/elettra-backend

jobs:
  verify:
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: elettra
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d elettra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELETTRA_CONFIG_FILE: config/elettra-config.image.yaml
      ELETTRA_TEST_ENV_FILE: /dev/null
      ELETTRA_TESTING: "1"
      DATABASE_URL: postgresql+asyncpg://admin:admin@127.0.0.1:5432/elettra
      APP_SECRET_KEY: ci-release-test-secret-key
      TEST_LOGIN_EMAIL: ci-release@example.com
      TEST_LOGIN_PASSWORD: CI-release-gate_Str0ng!
      TEST_AGENCY_ID: 11111111-1111-4111-8111-111111111111
      PGPASSWORD: admin
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release channel and stable ancestry
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          channel="$(bash .github/scripts/release-channel.sh "$GITHUB_REF")"
          if [ "$channel" = "stable" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Stable release tags must point to a commit contained in main."
              exit 1
            }
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest==8.4.2 pytest-asyncio==1.2.0 pip-audit==2.9.0

      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Resolve application version and verify release tag
        id: version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          config = yaml.safe_load(Path("config/elettra-config.image.yaml").read_text())
          app_version = str(config["app"]["version"])
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and app_version != tag_version:
              raise SystemExit(
                  f"release tag {tag_version!r} does not match app version {app_version!r}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"app_version={app_version}\n")
          PY

      - name: Initialize test database
        run: |
          psql -h 127.0.0.1 -U admin -d elettra \
            -v ON_ERROR_STOP=1 -f db/elettra_schema_init.sql
          psql -h 127.0.0.1 -U admin -d elettra \
            -v ON_ERROR_STOP=1 -f tests/ci_seed.sql

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee tests/reports/pytest.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: tests/reports/
          if-no-files-found: ignore
          retention-days: 14

  prepare-image:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/fix/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.target.outputs.matrix }}
      architectures: ${{ steps.target.outputs.architectures }}
      metadata: ${{ steps.metadata.outputs.json }}
      labels: ${{ steps.metadata.outputs.labels }}
      app_version: ${{ needs.verify.outputs.app_version }}
      core_tag: ${{ steps.core.outputs.tag }}
      core_commit: ${{ steps.core.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve frozen Elettra core provenance
        id: core
        shell: bash
        run: |
          core_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          core_tag="elettra-core-v${core_version}"
          core_commit="$(git rev-parse "${core_tag}^{commit}")"
          git merge-base --is-ancestor "$core_commit" HEAD || {
            echo "::error::Frozen core tag $core_tag is not contained in the release commit."
            exit 1
          }
          echo "tag=$core_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$core_commit" >> "$GITHUB_OUTPUT"

      - name: Select native runners
        id: target
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python - <<'PYTHON'
          import json
          import os

          targets = [{"arch": "amd64", "runner": "ubuntu-24.04"}]
          if os.environ["IS_RELEASE"] == "true":
              targets.append({"arch": "arm64", "runner": "ubuntu-24.04-arm"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps({'include': targets})}\n")
              output.write(f"architectures={json.dumps([item['arch'] for item in targets])}\n")
          PYTHON

      - name: Select publication channel
        id: channel
        shell: bash
        run: echo "name=$(bash .github/scripts/release-channel.sh "$GITHUB_REF")" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channel.outputs.name == 'stable' }}
            type=raw,value=latest,enable=${{ steps.channel.outputs.name == 'stable' }}
            type=sha,prefix=sha-,format=short,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=candidate-,format=short,enable=${{ startsWith(github.ref, 'refs/heads/fix/') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Elettra backend

  build-image:
    name: Build and verify ${{ matrix.arch }}
    needs: prepare-image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-image.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check native runner architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          case "$TARGET_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "::error::A native runner is required for $TARGET_ARCH"; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish only by digest here. Version/stable tags are assigned once,
      # after every requested architecture has built and passed its smoke test.
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare-image.outputs.labels }}
          build-args: |
            ELETTRA_CORE_SOURCE_COMMIT=${{ needs.prepare-image.outputs.core_commit }}
          # Registry caches survive release-tag boundaries. Each architecture
          # has its own cache so parallel jobs never overwrite each other.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
          sbom: true
          provenance: mode=max

      - name: Verify native image identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_APP_VERSION: ${{ needs.prepare-image.outputs.app_version }}
          EXPECTED_CORE_COMMIT: ${{ needs.prepare-image.outputs.core_commit }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          docker run --rm --entrypoint python \
            -e EXPECTED_APP_VERSION -e EXPECTED_CORE_COMMIT -e EXPECTED_ARCH \
            "$image_ref" -c '
          from pathlib import Path
          import os
          import platform
          from app.core.config import get_cached_settings
          assert get_cached_settings().app_version == os.environ["EXPECTED_APP_VERSION"]
          assert Path("/etc/elettra-core-image-commit").read_text().strip() == os.environ["EXPECTED_CORE_COMMIT"]
          assert platform.machine() == {"amd64": "x86_64", "arm64": "aarch64"}[os.environ["EXPECTED_ARCH"]]
          print("Verified native image version, architecture and frozen core")
          '

      - name: Export verified image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digests/$TARGET_ARCH.digest"

      - name: Upload verified image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/*.digest
          if-no-files-found: error
          retention-days: 7

  publish-image:
    needs:
      - prepare-image
      - build-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      core_tag: ${{ needs.prepare-image.outputs.core_tag }}
      core_commit: ${{ needs.prepare-image.outputs.core_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - name: Assemble and verify multi-platform image
        id: merge
        env:
          IMAGE_ARCHITECTURES: ${{ needs.prepare-image.outputs.architectures }}
          IMAGE_METADATA: ${{ needs.prepare-image.outputs.metadata }}
        run: python .github/scripts/merge-image.py

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - verify
      - publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image identity
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          EXPECTED_CORE_COMMIT: ${{ needs.publish-image.outputs.core_commit }}
        run: |
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          docker run --rm \
            --entrypoint python \
            -e EXPECTED_APP_VERSION="${GITHUB_REF_NAME#v}" \
            -e EXPECTED_CORE_COMMIT \
            "$image_ref" \
            -c 'from pathlib import Path; import os; from app.core.config import get_cached_settings; actual_version = get_cached_settings().app_version; expected_version = os.environ["EXPECTED_APP_VERSION"]; actual_core = Path("/etc/elettra-core-image-commit").read_text().strip(); expected_core = os.environ["EXPECTED_CORE_COMMIT"]; assert actual_version == expected_version, f"image version {actual_version!r} != {expected_version!r}"; assert actual_core == expected_core, f"image core {actual_core!r} != {expected_core!r}"; print(f"verified app {actual_version}, core {actual_core}")'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          CORE_TAG: ${{ needs.publish-image.outputs.core_tag }}
          CORE_COMMIT: ${{ needs.publish-image.outputs.core_commit }}
        run: |
          release_flags=()
          if [ "$(bash .github/scripts/release-channel.sh "$GITHUB_REF")" = "prerelease" ]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Elettra Backend ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Container: ${IMAGE_NAME}@${IMAGE_DIGEST}

          Frozen VECTO core: ${CORE_TAG} at ${CORE_COMMIT}."
