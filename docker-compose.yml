services:
  db:
    image: postgres:18-alpine
    container_name: elettra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elettra}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
      # Auto-initialize schema on first startup (only runs if db is empty)
      - ./db/elettra_schema_init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  app:
    image: ${ELETTRA_BACKEND_IMAGE:-elettra-backend-app}
    build:
      context: .
      args:
        ELETTRA_CORE_SOURCE_COMMIT: ${ELETTRA_CORE_SOURCE_COMMIT:-}
    container_name: elettra-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Point to the docker-specific config file copied into the image
      ELETTRA_CONFIG_FILE: /app/config/elettra-config.docker.yaml
      # Development-only default. Production uses docker-compose.external.yml,
      # where APP_SECRET_KEY is mandatory.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-only-change-me}
      # MinIO endpoint (Docker-internal)
      MINIO_ENDPOINT: minio:9000
      # The API needs only ListBucket/GetObject permissions on profile/model
      # buckets. Dedicated read-only credentials avoid worker/admin key reuse.
      AWS_ACCESS_KEY_ID: ${ELEVATION_PROFILES_READ_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-minio_user}}
      AWS_SECRET_ACCESS_KEY: ${ELEVATION_PROFILES_READ_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-minio_password}}
      GTFS_ELEVATION_PROFILES_BUCKET: ${GTFS_ELEVATION_PROFILES_BUCKET:-${ELEVATION_PROFILES_BUCKET:-elevation-profiles}}
      ELEVATION_PROFILES_BUCKET: ${ELEVATION_PROFILES_BUCKET:-elevation-profiles}
      # Empty keeps the legacy root namespace during the compatibility rollout.
      # Set this to a completed immutable release ID to switch every GTFS read.
      ELEVATION_PROFILES_RELEASE: ${ELEVATION_PROFILES_RELEASE:-}
      # These four pins form one fail-closed production switch. Local defaults
      # keep compatibility mode until an immutable release/model pair exists.
      CONSUMPTION_MODEL_RELEASE: ${CONSUMPTION_MODEL_RELEASE:-}
      LEGACY_CONSUMPTION_MODEL_RELEASE: ${LEGACY_CONSUMPTION_MODEL_RELEASE:-}
      VECTO_G2_CONSUMPTION_MODEL_RELEASE: ${VECTO_G2_CONSUMPTION_MODEL_RELEASE:-}
      VECTO_G0_TRANSFER_MODEL_RELEASE: ${VECTO_G0_TRANSFER_MODEL_RELEASE:-}
      DEFAULT_PREDICTION_STACK: ${DEFAULT_PREDICTION_STACK:-}
      ENABLE_EXPERIMENTAL_PREDICTION_STACKS: ${ENABLE_EXPERIMENTAL_PREDICTION_STACKS:-false}
      ELETTRA_CORE_SOURCE_COMMIT: ${ELETTRA_CORE_SOURCE_COMMIT:-}
      ELEVATION_AUX_PROFILE_ALGORITHM: ${ELEVATION_AUX_PROFILE_ALGORITHM:-}
      ELEVATION_AUX_ROADS_RELEASE: ${ELEVATION_AUX_ROADS_RELEASE:-}
      # Optionally override log level at runtime
      LOG_LEVEL: INFO
      # LCA API server selection (DEV / INT / PROD)
      # DEV:  https://d2ztsj2ne13pqv.cloudfront.net
      # INT:  https://d2r4i81snxys0y.cloudfront.net
      # PROD: https://d32sjses1ja2ls.cloudfront.net
      LCA_API_BASE_URL: ${LCA_API_BASE_URL:-https://d2ztsj2ne13pqv.cloudfront.net}
    ports:
      - "8002:8000"
    volumes:
      # Mount only if you want live-reload during local development (uncomment and set reload true)
      # - ./:/app
      - ./config/elettra-config.docker.yaml:/app/config/elettra-config.docker.yaml:ro
    # For local dev with code changes + reload you can override command:
    # command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  elettra-frontend-staging:
    image: ${ELETTRA_FRONTEND_IMAGE:-ghcr.io/supsi-ide/elettra@sha256:8868bc89a95f835f7a89399cefff25527af14e005245ed237bb790c8b9089933}
    container_name: elettra-frontend-staging
    restart: unless-stopped
    ports:
      - "${ELETTRA_STAGING_BIND_ADDRESS:-0.0.0.0}:${ELETTRA_STAGING_PORT:-55558}:80"
    environment:
      API_BACKEND_URL: ${ELETTRA_FRONTEND_API_BACKEND_URL:-http://app:8000}
      CARTO_API_KEY: ${CARTO_API_KEY:?CARTO_API_KEY is required}
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "9002:9000"
      # MinIO Console is available at http://localhost:9001
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ADMIN_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-minio_user}}"
      MINIO_ROOT_PASSWORD: "${MINIO_ADMIN_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-minio_password}}"
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ADMIN_ACCESS_KEY: ${MINIO_ADMIN_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-minio_user}}
      MINIO_ADMIN_SECRET_KEY: ${MINIO_ADMIN_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-minio_password}}
    entrypoint: >
      bash -c "
      mc alias set minio http://minio:9000 $${MINIO_ADMIN_ACCESS_KEY} $${MINIO_ADMIN_SECRET_KEY} &&
      mc mb minio/${ELEVATION_PROFILES_BUCKET:-elevation-profiles} --ignore-existing &&
      mc mb minio/${GTFS_ELEVATION_PROFILES_BUCKET:-${ELEVATION_PROFILES_BUCKET:-elevation-profiles}} --ignore-existing &&
      mc mb minio/consumption-models --ignore-existing &&
      echo 'Buckets created successfully'
      "

  elevation-profile-worker:
    profiles: ["road-deck"]
    image: ${ELEVATION_PROFILE_WORKER_IMAGE:-pyriadne-elevation-worker:local}
    build:
      context: ../pyriadne
      dockerfile: Dockerfile.elevation-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-elettra}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # The worker requires List/Get/Put/DeleteObject permissions and must use
      # a credential distinct from the backend's read-only identity.
      MINIO_ACCESS_KEY: ${ELEVATION_PROFILES_WRITE_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-minio_user}}
      MINIO_SECRET_KEY: ${ELEVATION_PROFILES_WRITE_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-minio_password}}
      ELEVATION_PROFILES_BUCKET: ${ELEVATION_PROFILES_BUCKET:-elevation-profiles}
      ROADS_GPKG: /data/swisstlm3d/roads.gpkg
      ROADS_MANIFEST: /data/swisstlm3d/roads_manifest.json
      ELEVATION_WORKER_POLL_SECONDS: ${ELEVATION_WORKER_POLL_SECONDS:-5}
      ELEVATION_WORKER_LEASE_SECONDS: ${ELEVATION_WORKER_LEASE_SECONDS:-900}
      ELEVATION_WORKER_MAX_ATTEMPTS: ${ELEVATION_WORKER_MAX_ATTEMPTS:-3}
      ELEVATION_WORKER_BACKOFF_SECONDS: ${ELEVATION_WORKER_BACKOFF_SECONDS:-30}
    volumes:
      - ${SWISSTLM3D_DATA_DIR:-../pyriadne/data/swisstlm3d}:/data/swisstlm3d:ro

  osrm-download:
    image: alpine:latest
    container_name: elettra-osrm-download
    volumes:
      - osrm-data:/data
    entrypoint: >
      sh -c "
      apk add --no-cache curl &&
      if [ ! -f /data/switzerland-latest.osm.pbf ]; then
        echo 'Downloading Switzerland OSM data...'
        curl -L -o /data/switzerland-latest.osm.pbf https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
        echo 'Switzerland OSM data downloaded successfully'
      else
        echo 'Switzerland OSM data already exists'
      fi
      "

  osrm-process:
    image: osrm/osrm-backend:latest
    container_name: elettra-osrm-process
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/data
    entrypoint: >
      bash -c "
      if [ ! -f /data/switzerland-latest.osrm ]; then
        echo 'Extracting OSRM data...'
        osrm-extract -p /opt/car.lua /data/switzerland-latest.osm.pbf
        echo 'OSRM data extracted successfully'
      else
        echo 'OSRM data already extracted'
      fi &&
      if [ ! -f /data/switzerland-latest.osrm.hsgr ]; then
        echo 'Contracting OSRM data...'
        osrm-contract /data/switzerland-latest.osrm
        echo 'OSRM data contracted successfully'
      else
        echo 'OSRM data already contracted'
      fi &&
      echo 'OSRM data preparation completed'
      "

  osrm:
    image: osrm/osrm-backend:latest
    container_name: elettra-osrm
    restart: unless-stopped
    depends_on:
      osrm-process:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    volumes:
      - osrm-data:/data
    command: osrm-routed --algorithm ch /data/switzerland-latest.osrm

  # Falco Security Monitoring (modern_ebpf engine, Falco 0.41.x)
  falco:
    image: falcosecurity/falco:0.41.3
    container_name: elettra-falco
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - ./falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./falco/rules.d:/etc/falco/rules.d:ro
      - falco-logs:/var/log/falco
      - falco-run:/run/falco
    command: ["falco", "-c", "/etc/falco/falco.yaml"]

  # Falcosidekick — forwards Falco alerts to Slack (and other outputs)
  falcosidekick:
    image: falcosecurity/falcosidekick:2.9.3
    container_name: elettra-falcosidekick
    restart: unless-stopped
    depends_on:
      - falco
    ports:
      - "2801:2801"
    environment:
      - SLACK_WEBHOOKURL=${SLACK_WEBHOOK_URL}
      - SLACK_MINIMUMPRIORITY=warning

  # Diun - Docker Image Update Notifier
  diun:
    image: crazymax/diun:latest
    container_name: elettra-diun
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun/diun.yml:/etc/diun/diun.yml:ro
      - diun-data:/data
    environment:
      - DIUN_NOTIF_SLACK_WEBHOOKURL=${SLACK_WEBHOOK_URL}
      - TZ=Europe/Zurich
    command: ["serve", "--config", "/etc/diun/diun.yml"]

  # Falco Exporter for Prometheus metrics (connects via shared gRPC socket)
  falco-exporter:
    image: falcosecurity/falco-exporter:0.8.7
    container_name: elettra-falco-exporter
    restart: unless-stopped
    depends_on:
      - falco
    ports:
      - "9376:9376"
    volumes:
      - falco-run:/run/falco:ro


volumes:
  db-data:
  minio-data:
  osrm-data:
  falco-logs:
  falco-run:
  diun-data:
