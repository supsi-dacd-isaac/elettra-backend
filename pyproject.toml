[project]
name = "elettra-core"
version = "2.2.0"
description = "Canonical feature and VECTO auxiliary contracts shared by Elettra training and inference"
requires-python = ">=3.10"
license = "MIT AND EUPL-1.2"
license-files = [
  "LICENSE",
  "LICENSES/EUPL-1.2.txt",
  "THIRD_PARTY_NOTICES.md",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
training = [
  "scipy>=1.10,<2",
]

[project.urls]
Source = "https://github.com/supsi-dacd-isaac/elettra-backend/tree/elettra-core-v2.2.0"
"VECTO upstream" = "https://code.europa.eu/vecto/vecto/-/archive/Release/v5.1.3/vecto-Release-v5.1.3.tar.gz"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elettra_core"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "elettra_core/THIRD_PARTY_NOTICES.md"
"LICENSES/EUPL-1.2.txt" = "elettra_core/licenses/EUPL-1.2.txt"
