[project]
name = "elettra-core"
version = "2.0.0"
description = "Canonical feature extraction contract shared by Elettra training and inference"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elettra_core"]
