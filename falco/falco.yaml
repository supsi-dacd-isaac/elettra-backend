# Falco Configuration for Elettra Backend Security Monitoring
# Targeting Falco 0.41.3 with modern_ebpf engine

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d

plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false

load_plugins:
  - container

engine:
  kind: modern_ebpf

# Output format
json_output: true
json_include_output_property: true
time_format_iso_8601: true

# Logging
log_level: info
log_stderr: true
log_syslog: false

# Output channels
stdout_output:
  enabled: true

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/falco.log

http_output:
  enabled: true
  url: "http://127.0.0.1:2801"
  user_agent: "Elettra-Falco-Security"
  insecure: true

# gRPC server (for falco-exporter)
grpc:
  enabled: true
  bind_address: "unix:///run/falco/falco.sock"
  threadiness: 0

grpc_output:
  enabled: true

# Event drop handling
syscall_event_drops:
  actions:
    - log
    - alert
  rate: 0.1
  max_burst: 1000

# Metrics
metrics:
  enabled: true
  interval: 10s
  output_rule: true
  kernel_event_counters_enabled: true
  libbpf_stats_enabled: false
  resource_utilization_enabled: true
  state_counters_enabled: true
