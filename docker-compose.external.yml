# Run the FastAPI app (plus the optional `road-deck` worker profile) against
# externally managed PostgreSQL and MinIO services.
# Example:
#   export DATABASE_URL=postgresql+asyncpg://user:pwd@your-db-host:5432/elettra
#   docker compose -f docker-compose.external.yml up --build

services:
  app:
    # Production should select the exact image digest that passed the release
    # gate instead of rebuilding a potentially dirty checkout on the host.
    image: ${ELETTRA_BACKEND_IMAGE:-elettra-backend-app}
    build: .
    container_name: elettra-api
    restart: unless-stopped
    environment:
      # Path to config file inside container (copied or mounted below)
      ELETTRA_CONFIG_FILE: /app/config/elettra-config.docker.yaml
      # Runtime overrides (DATABASE_URL MUST point to existing external DB host)
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the production PostgreSQL instance}
      APP_LOG_LEVEL: INFO
      APP_DEBUG: "false"
      # No production fallback: refusing to render the compose file is safer
      # than starting with the secret embedded in the repository config.
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set to a strong production secret}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # Grant this identity only ListBucket/GetObject on the profile and
      # consumption-model buckets used by backend reads.
      AWS_ACCESS_KEY_ID: ${ELEVATION_PROFILES_READ_ACCESS_KEY:?Set a read-only MinIO access key for the backend}
      AWS_SECRET_ACCESS_KEY: ${ELEVATION_PROFILES_READ_SECRET_KEY:?Set the read-only MinIO secret for the backend}
      # Leave unset before the atomic switch so compatibility mode reads the
      # current root namespace. Production v2 sets the dedicated GTFS bucket.
      GTFS_ELEVATION_PROFILES_BUCKET: ${GTFS_ELEVATION_PROFILES_BUCKET:-${ELEVATION_PROFILES_BUCKET:-elevation-profiles}}
      ELEVATION_PROFILES_BUCKET: ${ELEVATION_PROFILES_BUCKET:-elevation-profiles}
      ELEVATION_PROFILES_RELEASE: ${ELEVATION_PROFILES_RELEASE:-}
      CONSUMPTION_MODEL_RELEASE: ${CONSUMPTION_MODEL_RELEASE:-}
      ELEVATION_AUX_PROFILE_ALGORITHM: ${ELEVATION_AUX_PROFILE_ALGORITHM:-}
      ELEVATION_AUX_ROADS_RELEASE: ${ELEVATION_AUX_ROADS_RELEASE:-}
    ports:
      - "8000:8000"
    volumes:
      # Mount a docker-specific config (read-only). Adjust path if you rename file.
      - ./config/elettra-config.docker.yaml:/app/config/elettra-config.docker.yaml:ro
    # Command can be overridden for reload in dev with: --reload (not recommended in prod)
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  elevation-profile-worker:
    profiles: ["road-deck"]
    # Production must set this to an immutable registry tag or digest built
    # from pyriadne/Dockerfile.elevation-worker.
    image: ${ELEVATION_PROFILE_WORKER_IMAGE:-pyriadne-elevation-worker:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the production PostgreSQL instance}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # The worker needs List/Get/Put/DeleteObject. Keep these credentials
      # distinct from both the backend reader and the MinIO administrator. They
      # may remain empty while this profile is disabled; worker startup rejects
      # them before polling when `--profile road-deck` is enabled.
      MINIO_ACCESS_KEY: ${ELEVATION_PROFILES_WRITE_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${ELEVATION_PROFILES_WRITE_SECRET_KEY:-}
      ELEVATION_PROFILES_BUCKET: ${ELEVATION_PROFILES_BUCKET:-elevation-profiles}
      ROADS_GPKG: /data/swisstlm3d/roads.gpkg
      ROADS_MANIFEST: /data/swisstlm3d/roads_manifest.json
      ELEVATION_WORKER_POLL_SECONDS: ${ELEVATION_WORKER_POLL_SECONDS:-5}
      ELEVATION_WORKER_LEASE_SECONDS: ${ELEVATION_WORKER_LEASE_SECONDS:-900}
      ELEVATION_WORKER_MAX_ATTEMPTS: ${ELEVATION_WORKER_MAX_ATTEMPTS:-3}
      ELEVATION_WORKER_BACKOFF_SECONDS: ${ELEVATION_WORKER_BACKOFF_SECONDS:-30}
    volumes:
      - ${SWISSTLM3D_DATA_DIR:-./data/swisstlm3d}:/data/swisstlm3d:ro

# No volumes needed here (database is external)
